<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/panel/panel.css" />
    <title>isbar</title>
    <script type="module" src="/src/panel/main.ts"></script>
  </head>

  <body>
    <main class="panel">
      <header class="cabecera">
        <div>
          <b id="saludo">Hola</b>
          <small id="fecha"></small>
        </div>
        <button class="icono" id="ajustes" title="Configuración" aria-label="Configuración"></button>
      </header>

      <!-- Barra de 7 iconos: la pestaña activa enseña también su nombre (los iconos los pone main.ts) -->
      <nav class="pestanas" role="tablist">
        <button role="tab" data-vista="inicio" class="activa" title="Inicio"><span class="nombre">Inicio</span></button>
        <button role="tab" data-vista="avisos" title="Avisos"><span class="nombre">Avisos</span><span class="insignia" id="insignia" hidden></span></button>
        <button role="tab" data-vista="musica" title="Música"><span class="nombre">Música</span></button>
        <button role="tab" data-vista="pomodoro" title="Pomodoro"><span class="nombre">Pomodoro</span></button>
        <button role="tab" data-vista="pausas" title="Pausas"><span class="nombre">Pausas</span></button>
        <button role="tab" data-vista="tareas" title="Tareas"><span class="nombre">Tareas</span></button>
        <button role="tab" data-vista="sistema" title="Sistema"><span class="nombre">Sistema</span></button>
      </nav>

      <!-- Inicio: solo un resumen. Cada tarjeta lleva a su pestaña; algunas son carruseles -->
      <section class="vista activa" data-vista="inicio">
        <p class="estado-linea" id="estado-linea" hidden></p>
        <div class="tarjetas resumen">
          <article class="tarjeta mini" id="r-recursos" data-ir="sistema"></article>
          <article class="tarjeta mini" id="r-pomodoro" data-ir="pomodoro"></article>
          <article class="tarjeta mini" id="r-pausas" data-ir="pausas"></article>
          <article class="tarjeta mini" id="r-avisos" data-ir="avisos"></article>
          <article class="tarjeta mini ancha musica-mini" id="r-musica" data-ir="musica" hidden>
            <img class="m-caratula" alt="" />
            <div class="m-textos">
              <small class="m-estado"></small>
              <b class="m-titulo"></b>
            </div>
          </article>
          <article class="tarjeta mini" id="r-tiempo"></article>
          <article class="tarjeta mini" id="r-tareas" data-ir="tareas"></article>
        </div>
      </section>

      <section class="vista" data-vista="avisos">
        <div class="avisos-cabecera">
          <small id="avisos-cuenta"></small>
          <button class="enlace" id="borrar-todo" hidden>Borrar todo</button>
        </div>
        <ul class="avisos" id="avisos"></ul>
      </section>

      <section class="vista" data-vista="musica">
        <div class="musica" id="musica">
          <div class="caratula-grande"><img class="mg-caratula" alt="" /></div>
          <b class="mg-titulo"></b>
          <small class="mg-artista"></small>
          <div class="progreso">
            <span class="mg-pos">0:00</span>
            <div class="barra busqueda" id="busqueda" role="slider" aria-label="Posición de la canción"><i class="mg-barra"></i><span class="pomo"></span></div>
            <span class="mg-dur">0:00</span>
          </div>
          <div class="controles">
            <button class="icono-boton" data-musica="anterior" aria-label="Anterior"></button>
            <button class="icono-boton principal mg-play" data-musica="play" aria-label="Reproducir o pausar"></button>
            <button class="icono-boton" data-musica="siguiente" aria-label="Siguiente"></button>
          </div>
          <small class="mg-ritmo" hidden></small>
        </div>
        <p class="vacio" id="sin-musica">No suena nada ahora mismo.</p>
      </section>

      <section class="vista" data-vista="pomodoro">
        <div class="pomodoro" id="pomodoro">
          <div class="modos" role="radiogroup" aria-label="Modo">
            <button data-modo="enfoque">Enfoque</button>
            <button data-modo="corto" title="Descanso corto">Corto</button>
            <button data-modo="largo" title="Descanso largo">Largo</button>
          </div>
          <b class="reloj p-tiempo">25:00</b>
          <div class="barra"><i class="p-barra"></i></div>
          <small class="p-ciclos"></small>
          <div class="fila">
            <button class="boton principal p-alternar"></button>
            <button class="boton icono-boton p-reiniciar" title="Reiniciar" aria-label="Reiniciar"></button>
          </div>
        </div>
      </section>

      <section class="vista" data-vista="pausas">
        <p class="estado-linea" id="pa-rutina" hidden>Rutina en marcha: síguela en el globo del compañero.</p>
        <div class="tarjetas" id="pa-tipos"></div>
      </section>

      <section class="vista" data-vista="tareas">
        <p class="vacio">Pronto podrás apuntar aquí tus tareas y recordatorios.</p>
      </section>

      <section class="vista" data-vista="sistema">
        <div class="tarjetas">
          <article class="tarjeta ancha" id="s-bateria" hidden>
            <small>Batería<span class="s-b-ahorro" hidden> · ahorro activado</span></small>
            <b class="grande s-b-porcentaje"></b>
            <div class="barra"><i class="s-b-barra"></i></div>
            <small class="s-b-detalle"></small>
          </article>

          <article class="tarjeta ancha" id="s-volumen" hidden>
            <small class="s-v-dispositivo"></small>
            <div class="fila volumen">
              <button class="boton icono-boton s-v-silencio" aria-label="Silenciar o quitar el silencio"></button>
              <input type="range" min="0" max="100" step="1" class="s-v-nivel" aria-label="Volumen" />
              <b class="s-v-valor"></b>
            </div>
          </article>

          <article class="tarjeta ancha" id="s-conexion" hidden>
            <small>Conexión</small>
            <b class="s-c-estado"><i class="punto"></i><span class="s-c-texto"></span></b>
          </article>

          <article class="tarjeta" id="s-cpu" hidden>
            <small>Procesador</small>
            <b class="grande s-u-cpu"></b>
            <div class="barra"><i class="s-u-cpu-barra"></i></div>
          </article>

          <article class="tarjeta" id="s-memoria" hidden>
            <small>Memoria</small>
            <b class="grande s-u-memoria"></b>
            <div class="barra"><i class="s-u-memoria-barra"></i></div>
            <small class="s-u-memoria-gb"></small>
          </article>
        </div>
      </section>
    </main>
  </body>
</html>
