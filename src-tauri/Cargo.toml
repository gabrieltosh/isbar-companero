[package]
name = "isla"
version = "0.1.0"
description = "Dynamic Island para Windows"
authors = ["Gabriel Pinto"]
license = "MIT"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "isla_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-store = "2"
tauri-plugin-autostart = "2"
# Solo una copia a la vez: si se vuelve a abrir, avisa a la que ya está en marcha
tauri-plugin-single-instance = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Solo Windows: SMTC (multimedia) y notificaciones vía WinRT
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
  "ApplicationModel",
  "Foundation_Collections",
  "Media_Control",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Foundation",
  "Storage_Streams",
  "UI_Notifications",
  "UI_Notifications_Management",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_SystemInformation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_WinRT",
  # Qué ventana queda debajo del compañero al soltarlo: programa y ventanas ocultas
  "Win32_System_Threading",
  "Win32_Graphics_Dwm",
  # Evento que pide la escucha de solo la app de música (CreateEventW)
  "Win32_Security",
  # Estado del sistema (sistema.rs): batería, nombre del dispositivo de salida y conexión
  "Devices_Power",
  "Win32_System_Power",
  "Win32_Devices_FunctionDiscovery",
  "Win32_UI_Shell_PropertiesSystem",
  "Networking_Connectivity",
] }
# Para escribir el aviso de "escucha preparada" de Windows (macro #[implement]); ya la usa `windows`
windows-core = "0.62"
# Tipo IAsyncOperation de WinRT (el crate windows ya no lo reexporta)
windows-future = "0.3"
# Tipo IVectorView de WinRT (listas de notificaciones)
windows-collections = "0.3"
# Codificar la carátula como data URL
base64 = "0.22"
